<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Manrope:wght@400;600;700&display=swap');
:root { --font-heading: 'Oswald', system-ui, sans-serif; --font-body: 'Manrope', system-ui, sans-serif; }
body { background: #ffffff; margin: 0; font-family: var(--font-body); }
a { color: var(--color-accent-700); text-underline-offset: 3px; }
a:hover { color: var(--color-accent-600); }
/* sticky host */
html, body { height: auto; min-height: 100%; }
#dc-root, .sc-host { height: auto; min-height: 100%; }
</style>
<link rel="stylesheet" href="../responsive.css">
</helmet>

<nav class="nav" data-screen-label="Navegación" style="position:sticky;top:0;z-index:60;box-shadow:0 1px 0 rgba(27,24,22,0.10), 0 6px 18px rgba(27,24,22,0.06);padding-inline:max(40px, calc((100% - 1280px) / 2 + 40px)); background:#1b1816;color:#f3f2f2">
  <a href="../" class="nav-brand" aria-label="Ir al inicio" style="display:flex;flex-direction:column;line-height:1.1;text-decoration:none;color:#f3f2f2">
    <span style="font-size:26px;letter-spacing:0.14em">MAROS</span>
    <span style="font-family:var(--font-body);font-size:9px;letter-spacing:0.26em;text-transform:uppercase;color:var(--color-accent-400)">Perfumes &amp; Decants</span>
  </a>
  <a href="../catalogo/" style="font-size:12.5px;letter-spacing:0.08em;text-transform:uppercase;text-decoration:none;color:rgba(243,242,242,0.85)" style-hover="color:var(--color-accent-400)">Catálogo</a>
  <a href="../decants/" style="font-size:12.5px;letter-spacing:0.08em;text-transform:uppercase;text-decoration:none;color:rgba(243,242,242,0.85)" style-hover="color:var(--color-accent-400)">Decants</a>
  <a href="../packs/" style="font-size:12.5px;letter-spacing:0.08em;text-transform:uppercase;text-decoration:none;color:rgba(243,242,242,0.85)" style-hover="color:var(--color-accent-400)">Packs de decants</a>
  <a href="../combo/" style="font-size:12.5px;letter-spacing:0.08em;text-transform:uppercase;text-decoration:none;color:rgba(243,242,242,0.85)" style-hover="color:var(--color-accent-400)">Arma tu combo</a>
  <a href="../contacto/" aria-current="page" style="font-size:12.5px;letter-spacing:0.08em;text-transform:uppercase;text-decoration:none;color:var(--color-accent-400)">Contacto</a>
  <div style="display:flex;gap:6px;align-items:center">
    <button type="button" aria-label="Buscar" onClick="{{ openSearch }}" style="background:none;border:none;padding:6px;cursor:pointer;color:var(--color-accent-400);display:flex" style-hover="color:#f3f2f2"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg></button>

    <button type="button" aria-label="Carrito" onClick="{{ openCart }}" style="background:none;border:none;padding:6px;cursor:pointer;color:var(--color-accent-400);display:flex;position:relative" style-hover="color:#f3f2f2"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l1 14H5L6 7Z"></path><path d="M9 7a3 3 0 0 1 6 0"></path></svg><sc-if value="{{ hasCart }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;top:-2px;right:-2px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--color-accent);color:#1b1816;font-size:9.5px;font-weight:700;display:flex;align-items:center;justify-content:center;font-feature-settings:'tnum' 1">{{ cartCount }}</span></sc-if></button>
  </div>
</nav>

<section class="mp-shell" data-screen-label="Contacto" style="background:#dedcdb;padding:56px 40px;min-height:calc(100vh - 76px)">
  <div style="max-width:1280px;margin:0 auto">
    <div style="font-size:12px;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-accent-700)">{{ bannerKicker }}</div>
    <h1 style="font-family:var(--font-heading);font-weight:500;font-size:34px;margin:6px 0 0;color:#1b1816">Contacto</h1>
    <p style="font-size:14px;color:color-mix(in srgb, #1b1816 65%, transparent);max-width:60ch;margin:10px 0 24px">{{ bannerSub }}</p>
    <div class="mp-cols-2" style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
      <input type="text" placeholder="Nombre" aria-label="Nombre" style="min-height:52px;padding:14px 18px;font:inherit;font-size:13px;color:#1b1816;background:#ffffff;border:none;border-radius:var(--radius-md)">
      <input type="email" placeholder="Correo electrónico" aria-label="Correo electrónico" style="min-height:52px;padding:14px 18px;font:inherit;font-size:13px;color:#1b1816;background:#ffffff;border:none;border-radius:var(--radius-md)">
    </div>
    <input type="tel" placeholder="Teléfono" aria-label="Teléfono" style="width:100%;margin-top:16px;min-height:52px;padding:14px 18px;font:inherit;font-size:13px;color:#1b1816;background:#ffffff;border:none;border-radius:var(--radius-md);box-sizing:border-box">
    <textarea placeholder="Comentario" aria-label="Comentario" rows="6" style="width:100%;margin-top:16px;padding:14px 18px;font:inherit;font-size:13px;color:#1b1816;background:#ffffff;border:none;border-radius:var(--radius-md);box-sizing:border-box;resize:vertical"></textarea>
    <button type="button" style="margin-top:20px;background:#1b1816;color:#ffffff;border:none;border-radius:999px;padding:14px 32px;font:inherit;font-size:13px;font-weight:600;cursor:pointer" style-hover="background:#33302d">Enviar</button>
  </div>
</section>

<a href="https://wa.me/51987654321" aria-label="Escríbenos por WhatsApp" style="position:fixed;right:24px;bottom:24px;width:56px;height:56px;border-radius:50%;background:#25d366;color:#ffffff;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-lg);z-index:50" style-hover="background:#1fb958"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-8.5 8.5 8.5 8.5 0 0 1-3.8-.9L3 21l1.9-5.7a8.5 8.5 0 1 1 16.1-3.8Z"></path></svg></a>


</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { searchOpen: false,
    bannerKicker: 'Estamos para ayudarte',
    bannerSub: 'Escríbenos y te respondemos por WhatsApp o correo.' };
  componentDidMount() {
    window.MarosCart.onChange(() => this.forceUpdate());
    // Esta página no consultaba nada; store.js ya trae los datos del panel.
    window.MarosData.ready(data => {
      const b = ((data || {}).banners || {}).contacto;
      if (!b) return;
      this.setState({
        bannerKicker: b.kicker || this.state.bannerKicker,
        bannerSub: b.subtitulo || this.state.bannerSub
      });
    });
  }
  renderVals() {
    return {
      bannerKicker: this.state.bannerKicker, bannerSub: this.state.bannerSub,
      searchOpen: this.state.searchOpen,
      cartCount: window.MarosCart.count(),
      hasCart: window.MarosCart.count() > 0,
      openCart: () => window.MarosCart.open(),
      openSearch: () => this.setState({ searchOpen: true }),
      closeSearch: () => this.setState({ searchOpen: false }),
      stopClick: (e) => e.stopPropagation()
    };
  }
}
</script>
</body>
</html>
